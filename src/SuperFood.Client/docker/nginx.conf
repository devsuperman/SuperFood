server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    types {
        application/wasm wasm;
    }

    # Blazor WASM is a single-page app: any path that isn't a real static
    # file falls back to index.html so client-side routing handles it.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
